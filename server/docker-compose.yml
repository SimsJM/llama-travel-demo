services:
  checkout:
    build: .
    container_name: llama-checkout
    restart: unless-stopped
    # Bound to the LXC's LAN address so Caddy can reach it. Not exposed publicly —
    # only Caddy talks to this, and only Cloudflare talks to Caddy.
    ports:
      - "4242:4242"
    env_file:
      - .env
    environment:
      PORT: 4242
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
